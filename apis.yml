name: Waymark
description: >-
  Waymark is a healthcare technology and services company that scales value-based,
  community-based care for people enrolled in Medicaid. In partnership with health
  plans and primary care providers, Waymark trains and employs local care teams —
  community health workers, care coordinators, licensed therapists, and pharmacists —
  and equips them with predictive technology that identifies high-risk patients and
  coordinates interventions addressing the social determinants of health such as
  housing, food security, transportation, medication management, and behavioral
  health. The model is designed to reduce avoidable hospitalizations and emergency
  room visits, and Waymark operates community-based care across Ohio, Virginia, and
  Washington. The company is backed by Andreessen Horowitz (a16z), NEA, Lux Capital,
  and CVS Health Ventures. Waymark publishes no public developer API or documentation
  surface; this profile captures the company identity and its public web presence.
